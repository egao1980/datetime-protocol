name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: datetime-protocol-test-${{ github.ref }}
  cancel-in-progress: true

env:
  SBCL_VERSION: 2.6.7
  ROSWELL_VERSION: "26.02.116"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: egao1980/cl-repository/.github/actions/setup-client@main

      - uses: egao1980/cl-repository/.github/actions/setup-roswell@main
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}

      - name: cl-repo install deps
        shell: bash
        run: |
          ros -l scripts/ci-install.lisp -q

      - name: Test
        shell: bash
        run: |
          ros -l scripts/ci-test.lisp -q

  # ECL smoke — linux/amd64 only (cl-stack#42). Local brew ECL already green.
  test-ecl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: egao1980/cl-repository/.github/actions/setup-client@main

      - uses: egao1980/cl-repository/.github/actions/setup-roswell@main
        with:
          install-sbcl: "false"
          roswell-version: ${{ env.ROSWELL_VERSION }}

      - name: Install ECL
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential libffi-dev libgc-dev libgmp-dev
          ros install ecl
          ros use ecl

      - name: cl-repo install deps
        shell: bash
        run: |
          ros -l scripts/ci-install.lisp -q

      - name: Test
        shell: bash
        run: |
          ros -l scripts/ci-test.lisp -q
