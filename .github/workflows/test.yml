name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SBCL_VERSION: 2.6.7
  ROSWELL_VERSION: "26.02.116"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    uses: egao1980/cl-repository/.github/workflows/test-system.yml@main

  test-ecl:
    uses: egao1980/cl-repository/.github/workflows/test-system-impl.yml@main
    permissions:
      contents: read
      packages: read
    with:
      lisp: ecl
